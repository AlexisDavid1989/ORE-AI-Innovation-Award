<svg viewBox="0 0 1400 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ORE AI Innovation Award concept 06 spotlight theta">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="520" fill="#0A0A0A"/>

  <circle cx="210" cy="250" r="112" fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
  <rect x="292" y="165" width="48" height="170" fill="#0A0A0A" transform="rotate(28 316 250)"/>

  <!-- Spotlight -->
  <path d="M 210 126 L 148 318 L 272 318 Z" fill="url(#beam)"/>

  <!-- Theta glyph: ring + center bar + decay line -->
  <circle cx="210" cy="246" r="34" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <line x1="183" y1="246" x2="237" y2="246" stroke="#8B7FD9" stroke-width="5"/>
  <path d="M 170 286 C 191 280, 224 275, 252 262" fill="none" stroke="url(#gold)" stroke-width="4"/>

  <text x="390" y="220" fill="url(#gold)" font-size="92" letter-spacing="7" font-family="Cinzel, 'Times New Roman', serif">ORE AI</text>
  <text x="390" y="302" fill="url(#gold)" font-size="58" letter-spacing="6" font-family="Cinzel, 'Times New Roman', serif">INNOVATION AWARD</text>
  <text x="392" y="348" fill="#B9A169" font-size="24" letter-spacing="4" font-family="Inter, 'Segoe UI', sans-serif">THETA EDITION - TIME DECAY</text>
</svg>
