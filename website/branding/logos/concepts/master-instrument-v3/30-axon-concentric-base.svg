<svg viewBox="0 0 1400 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ORE Axon concentric base concept">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8C089"/>
      <stop offset="100%" stop-color="#8F7844"/>
    </linearGradient>
    <clipPath id="axonCoreClip">
      <circle cx="210" cy="250" r="78"/>
    </clipPath>
  </defs>

  <rect width="1400" height="520" fill="#0A0A0A"/>

  <circle cx="210" cy="250" r="112" fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
  <line x1="285.1" y1="187.0" x2="306.5" y2="169.0" stroke="#0A0A0A" stroke-width="24"/>
  <line x1="113.5" y1="331.0" x2="134.9" y2="313.0" stroke="#0A0A0A" stroke-width="24"/>

  <circle cx="210" cy="250" r="132" fill="none" stroke="url(#ink)" stroke-width="1.6" opacity="0.52"/>
  <circle cx="210" cy="250" r="148" fill="none" stroke="url(#ink)" stroke-width="0.9" opacity="0.18"/>

  <g clip-path="url(#axonCoreClip)">
    <circle cx="210" cy="250" r="74" fill="none" stroke="url(#ink)" stroke-width="1.8" opacity="0.32"/>

    <!-- Concentric broken circular maze, directly inspired by the provided base -->
    <circle cx="210" cy="250" r="68" fill="none" stroke="url(#ink)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="248 180" transform="rotate(-24 210 250)"/>
    <circle cx="210" cy="250" r="60" fill="none" stroke="url(#ink)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="222 156" transform="rotate(-33 210 250)"/>
    <circle cx="210" cy="250" r="52" fill="none" stroke="url(#ink)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="200 126" transform="rotate(-42 210 250)"/>
    <circle cx="210" cy="250" r="44" fill="none" stroke="url(#ink)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="170 106" transform="rotate(-50 210 250)"/>
    <circle cx="210" cy="250" r="36" fill="none" stroke="url(#ink)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="146 80" transform="rotate(-58 210 250)"/>
    <circle cx="210" cy="250" r="28" fill="none" stroke="url(#ink)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="118 58" transform="rotate(-64 210 250)"/>
    <circle cx="210" cy="250" r="20" fill="none" stroke="url(#ink)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="92 36" transform="rotate(-70 210 250)"/>

    <!-- Short orthogonal bridges keep the "maze/chip" read without a dominant diagonal line -->
    <path d="M 166 296 L 176 296 L 176 284" fill="none" stroke="url(#gold)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 184 316 L 184 304 L 198 304" fill="none" stroke="url(#gold)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 230 304 L 230 292 L 246 292" fill="none" stroke="url(#gold)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 244 272 L 256 272 L 256 258" fill="none" stroke="url(#gold)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pin dots to match the reference style -->
    <circle cx="148" cy="248" r="2" fill="url(#ink)"/>
    <circle cx="160" cy="222" r="2" fill="url(#ink)"/>
    <circle cx="186" cy="202" r="2" fill="url(#ink)"/>
    <circle cx="218" cy="194" r="2" fill="url(#ink)"/>
    <circle cx="252" cy="202" r="2" fill="url(#ink)"/>
    <circle cx="274" cy="222" r="2" fill="url(#ink)"/>
    <circle cx="282" cy="248" r="2" fill="url(#ink)"/>
    <circle cx="276" cy="272" r="2" fill="url(#ink)"/>
    <circle cx="258" cy="292" r="2" fill="url(#ink)"/>
    <circle cx="232" cy="306" r="2" fill="url(#ink)"/>
    <circle cx="198" cy="314" r="2" fill="url(#ink)"/>
    <circle cx="170" cy="306" r="2" fill="url(#ink)"/>

    <circle cx="176" cy="284" r="2.8" fill="url(#gold)"/>
    <circle cx="198" cy="304" r="2.8" fill="url(#gold)"/>
    <circle cx="230" cy="292" r="2.8" fill="url(#gold)"/>
    <circle cx="256" cy="258" r="2.8" fill="url(#gold)"/>
  </g>

  <text x="390" y="220" fill="url(#gold)" font-size="92" letter-spacing="7" font-family="Cinzel, 'Times New Roman', serif">ORE AXON</text>
  <text x="390" y="302" fill="url(#gold)" font-size="58" letter-spacing="6" font-family="Cinzel, 'Times New Roman', serif">CONCENTRIC BASE</text>
  <text x="392" y="348" fill="#B9A169" font-size="24" letter-spacing="4" font-family="Inter, 'Segoe UI', sans-serif">REFERENCE-DRIVEN CIRCULAR MAZE INTEGRATED IN ORE CORE</text>
</svg>
